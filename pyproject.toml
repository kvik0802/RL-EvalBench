[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-evalbench"
version = "0.1.0"
description = "Frontier Reinforcement Learning Environment & Dynamic Verification Engine for LLM Agents"
readme = "README.md"
authors = [{ name = "Naini Vivekanand", email = "vicky@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0"
]

[project.scripts]
rleval = "rleval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
